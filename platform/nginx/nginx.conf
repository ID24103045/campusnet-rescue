worker_processes auto;
events { worker_connections 512; }
http {
  server_tokens off;
  log_format main '$remote_addr [$time_iso8601] "$request" $status $body_bytes_sent';
  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;
  limit_req_zone $binary_remote_addr zone=flag:5m rate=30r/m;
  server { listen 80; return 301 https://$host$request_uri; }
  server {
    listen 443 ssl;
    ssl_certificate     /etc/nginx/certs/ctf.crt;
    ssl_certificate_key /etc/nginx/certs/ctf.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 50m;
    location /api/v1/challenges/attempt { limit_req zone=flag burst=10 nodelay; proxy_pass http://ctfd:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location / { proxy_pass http://ctfd:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
  }
}
